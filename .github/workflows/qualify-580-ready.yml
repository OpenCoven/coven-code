name: Verify PR 624 readiness
on:
  push:
    branches: [qualify/580-readiness-624]
permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
  statuses: write
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: 7e6544ea9211f3df9a958e7847e17ac7f6fef122
      - name: Check the integrated head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 35); do
            test "$(gh api repos/OpenCoven/coven-code/pulls/624 --jq .head.sha)" = b290697741c71a2e8e515a4fe6459e5bb62954f7 || exit 1
            if scripts/agent/pr-ready.sh 624 --require-workflow 'Rust CI' --require-workflow 'TUI Tests'; then exit 0; fi
            sleep 60
          done
          exit 1
      - name: Record the readiness result on this verification commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=pr-ready-verification -f description="Repository readiness script for PR 624" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
