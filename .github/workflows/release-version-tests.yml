name: Release version tests

on:
  pull_request:
    paths:
      - 'scripts/check-release-version.py'
      - 'scripts/test-release-version.py'
      - 'scripts/bump-version.py'
      - '.github/workflows/release.yml'
      - '.github/workflows/auto-release.yml'
      - '.github/workflows/release-version-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify release preflight and forward-only ordering
        run: python3 -B scripts/test-release-version.py -v
