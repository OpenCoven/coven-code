name: Agent tools tests

on:
  pull_request:
    paths:
      - 'scripts/agent/**'
      - '.github/workflows/agent-tools-tests.yml'
      # test_gates.py checks gates.sh against the cargo commands in Rust CI.
      - '.github/workflows/rust-ci.yml'
  workflow_dispatch:

concurrency:
  group: agent-tools-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent-tools:
    name: Agent tools offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The oldest Python the tools support.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Require shellcheck
        run: shellcheck --version
      - name: Test pr-ready, replace-state and gates without GitHub or cargo
        env:
          REQUIRE_SHELLCHECK: '1'
        run: python3 -B -m unittest discover -s scripts/agent -p 'test_*.py' -v
