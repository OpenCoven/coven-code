name: Shell installer tests

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'scripts/test_install.py'
      - '.github/workflows/installer-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify local and download paths without network
        run: python3 -B scripts/test_install.py
      - name: Check shell syntax
        run: bash -n install.sh
