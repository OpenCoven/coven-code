name: Verify PR 612 readiness
on:
  push:
    branches: [qualify/612-readiness]
permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
  statuses: write
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: 5b4e998b0fb5138a985b4988425a118d34378d65
      - name: Check the integrated head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 35); do
            test "$(gh api repos/OpenCoven/coven-code/pulls/612 --jq .head.sha)" = 398d92ca07cc9c18e2929892ad3a3397ea7bd6f3 || exit 1
            if scripts/agent/pr-ready.sh 612 --require-workflow 'Rust CI' --require-workflow 'TUI Tests' --require-workflow 'Version stamp tests'; then exit 0; fi
            sleep 60
          done
          exit 1
      - name: Record the readiness result on this verification commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          state=failure
          if [ "$RESULT" = success ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=pr-ready-verification -f description="Repository readiness script for PR 612" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
