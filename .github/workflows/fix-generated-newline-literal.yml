name: Fix generated newline literal

on:
  push:
    branches:
      - fix/paste-burst-release-events
    paths:
      - .github/workflows/fix-generated-newline-literal.yml

permissions:
  contents: write

jobs:
  correct:
    if: github.repository == 'OpenCoven/coven-code' && github.ref == 'refs/heads/fix/paste-burst-release-events'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/paste-burst-release-events
          fetch-depth: 0
          persist-credentials: true

      - name: Correct the exact malformed byte sequence
        run: python3 scripts/fix-generated-newline-literal.py

      - name: Validate Rust syntax and patch scope
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rustfmt
          rustfmt --edition 2021 --check src-rust/crates/tui/src/app.rs
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "src-rust/crates/tui/src/app.rs" ]]; then
            printf 'unexpected generated paths:\n'
            printf '  %s\n' "${changed[@]}"
            exit 1
          fi

      - name: Commit correction and retire one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-generated-newline-literal.yml
          git rm scripts/fix-generated-newline-literal.py
          git add src-rust/crates/tui/src/app.rs
          git commit -m "fix(tui): emit a valid newline character literal"
          git push origin HEAD:fix/paste-burst-release-events
