name: All required

# One status that means "every check on this pull request head passed".
#
# The other pull_request workflows are path-filtered, so a given head runs
# anywhere from none of them to all of them, and `needs:` cannot reach across
# workflows. This workflow has no path filter, so it reports on every pull
# request. Its single job waits for every other workflow run on the head
# commit (the repository's workflows and CodeQL default setup) and every
# check run from another app, then:
#   - fails as soon as any of them ends failed, cancelled, timed out,
#     stale, action_required or startup_failure;
#   - passes once all of them have completed (success, skipped or neutral)
#     and the set is unchanged across two polls.
# Only the latest run of each workflow, and only that run's jobs, count.
#
# After re-running a failed job elsewhere, re-run this workflow too; it waits
# for the re-run to finish.

on:
  pull_request:

permissions:
  actions: read
  checks: read

concurrency:
  group: all-required-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  all-required:
    name: all-required
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SELF_RUN_ID: ${{ github.run_id }}
      # Seconds to wait before the first look, between polls, and before
      # confirming that a fully completed set did not change.
      SETTLE: '30'
      POLL: '60'
      CONFIRM: '20'
    steps:
      - name: Wait for every other check on the head, then fail if any failed
        shell: bash
        run: |
          set -uo pipefail
          api="repos/${GITHUB_REPOSITORY}"
          bad='["failure","cancelled","timed_out","action_required","startup_failure","stale"]'

          self_workflow=""
          for _ in 1 2 3; do
            self_workflow=$(gh api "$api/actions/runs/$SELF_RUN_ID" --jq .workflow_id) && break
            sleep 10
          done
          if [ -z "$self_workflow" ]; then
            echo "::error::Could not read this run's workflow id."
            exit 1
          fi

          # Prints one JSON array: the latest run of every other workflow on
          # the head, then the check runs that belong to those runs or to
          # another app (latest per name).
          snapshot() {
            local runs checks
            runs=$(gh api --paginate "$api/actions/runs?head_sha=$HEAD_SHA&per_page=100" \
                     --jq '.workflow_runs[]' |
                   jq -s --argjson self "$self_workflow" '
                     map(select(.workflow_id != $self))
                     | group_by(.workflow_id) | map(max_by(.id))
                     | map({kind: "workflow", id, name, status, conclusion,
                            url: .html_url, suite: .check_suite_id})') || return 1
            checks=$(gh api --paginate "$api/commits/$HEAD_SHA/check-runs?filter=all&per_page=100" \
                       --jq '.check_runs[]' |
                     jq -s --argjson runs "$runs" '
                       ($runs | map(.suite)) as $keep
                       | map(select(.app.slug != "github-actions"
                                    or (.check_suite.id as $s | any($keep[]; . == $s))))
                       | group_by([.app.id, .name]) | map(max_by(.id))
                       | map({kind: "check", id, name, status, conclusion,
                              url: .html_url})') || return 1
            jq -n --argjson a "$runs" --argjson b "$checks" '$a + $b'
          }

          report() {
            {
              echo "| Kind | Name | Result |"
              echo "| --- | --- | --- |"
              jq -r '.[] | "| \(.kind) | [\(.name)](\(.url)) | \(.conclusion // .status) |"' <<<"$1"
            } >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | "\(.kind)\t\(.conclusion // .status)\t\(.name)\t\(.url)"' <<<"$1"
          }

          echo "Head $HEAD_SHA"
          sleep "$SETTLE"
          previous=""
          while :; do
            if ! now=$(snapshot); then
              echo "::warning::A GitHub API call failed; trying again."
              sleep "$POLL"
              continue
            fi

            failed=$(jq --argjson bad "$bad" \
              'map(select(.status == "completed" and (.conclusion as $c | any($bad[]; . == $c))))' <<<"$now")
            if [ "$(jq length <<<"$failed")" -gt 0 ]; then
              report "$now"
              jq -r '.[] | "::error::\(.kind) \"\(.name)\" ended \(.conclusion): \(.url)"' <<<"$failed"
              exit 1
            fi

            pending=$(jq 'map(select(.status != "completed"))' <<<"$now")
            if [ "$(jq length <<<"$pending")" -eq 0 ]; then
              signature=$(jq -c 'map([.kind, .id, .conclusion]) | sort' <<<"$now")
              if [ "$signature" = "$previous" ]; then
                report "$now"
                echo "All $(jq length <<<"$now") other workflow runs and checks on $HEAD_SHA passed."
                exit 0
              fi
              previous=$signature
              sleep "$CONFIRM"
              continue
            fi

            previous=""
            echo "Waiting on $(jq length <<<"$pending"): $(jq -r 'map(.name) | join(", ")' <<<"$pending")"
            sleep "$POLL"
          done
