name: Rust CI

on:
  pull_request:
    paths:
      - 'src-rust/**'
      - 'scripts/test-headless-schemas.py'
      - 'scripts/run-coven-contract.py'
      - 'scripts/test-coven-contract-runner.py'
      - 'scripts/check-release-version.py'
      - 'scripts/test-release-version.py'
      - 'scripts/bump-version.py'
      - '.github/workflows/rust-ci.yml'
  workflow_dispatch:

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  headless-schemas:
    name: Headless JSON Schema constraints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify release version preflight
        run: python scripts/test-release-version.py

      - name: Validate runtime fixtures and cross-field constraints
        run: |
          python -m pip install jsonschema==4.25.1
          python scripts/test-headless-schemas.py

  rust:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Cache cargo registry and build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-rust/target
          key: rust-ci-cargo-${{ runner.os }}-${{ hashFiles('src-rust/Cargo.lock') }}
          restore-keys: rust-ci-cargo-${{ runner.os }}-

      - name: Check formatting
        working-directory: src-rust
        run: cargo fmt --all -- --check

      - name: Check workspace
        working-directory: src-rust
        run: cargo check --workspace --locked

      - name: Run Clippy
        working-directory: src-rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        working-directory: src-rust
        run: cargo test --workspace --locked --quiet

      # Contract-freeze fixtures (coven/docs/ENGINE-CONTRACT.md surfaces,
      # slash-command registry, default keybindings, Classic TUI baselines).
      # Already covered by the workspace run above; repeated by name so a
      # contract break is visible as its own failing step.
      - name: Contract fixtures
        working-directory: src-rust
        run: |
          cargo test -p claurst --locked --test engine_contract
          cargo test -p claurst-commands --locked --test slash_command_registry
          cargo test -p claurst-core --locked --test keybindings_golden
          cargo test -p claurst-tui --locked --test classic_baselines

  coven-contract:
    name: Coven engine contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (engine + coven)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libopenblas-dev

      - name: Build the engine
        working-directory: src-rust
        run: cargo build -p claurst --locked

      - name: Check out OpenCoven/coven
        uses: actions/checkout@v5
        with:
          repository: OpenCoven/coven
          path: coven-main
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test reverse-contract guard
        run: python scripts/test-coven-contract-runner.py

      - name: Build consumer contract test executable
        working-directory: coven-main
        run: |
          cargo test -p coven-cli --bin coven --locked --no-run --message-format=json > "$RUNNER_TEMP/coven-test-artifacts.jsonl"

      - name: Run exact consumer engine contract tests
        run: |
          python scripts/run-coven-contract.py \
            --engine "$GITHUB_WORKSPACE/src-rust/target/debug/coven-code" \
            --cargo-artifacts "$RUNNER_TEMP/coven-test-artifacts.jsonl"
