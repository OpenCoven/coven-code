name: Rust CI

on:
  pull_request:
    paths:
      - 'src-rust/**'
      - 'scripts/test-headless-schemas.py'
      - 'scripts/run-coven-contract.py'
      - 'scripts/test-coven-contract-runner.py'
      - 'scripts/check-release-version.py'
      - 'scripts/test-release-version.py'
      - 'scripts/bump-version.py'
      - 'install.sh'
      - 'install.ps1'
      - 'scripts/*checksums*'
      - 'scripts/package-release.py'
      - 'scripts/test-package-release.py'
      - '.github/workflows/patch-release.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/rust-ci.yml'
  workflow_dispatch:

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  installer-checksums:
    name: Installer checksum fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify archive contents and packaging rejection paths
        run: python scripts/test-package-release.py
      - name: Verify canonical release manifests
        run: node scripts/generate-release-checksums.test.mjs
      - name: Verify Bash checksum failure boundaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n install.sh scripts/install-sh-checksums.test.sh
          bash scripts/install-sh-checksums.test.sh
      - name: Verify PowerShell checksum failure boundaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install-ps1-checksums.test.ps1

  headless-schemas:
    name: Headless JSON Schema constraints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify release version preflight
        run: python scripts/test-release-version.py

      - name: Validate runtime fixtures and cross-field constraints
        run: |
          python -m pip install jsonschema==4.25.1
          python scripts/test-headless-schemas.py

  rust:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Cache cargo registry and build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-rust/target
          key: rust-ci-cargo-${{ runner.os }}-${{ hashFiles('src-rust/Cargo.lock') }}
          restore-keys: rust-ci-cargo-${{ runner.os }}-

      - name: Check formatting
        working-directory: src-rust
        run: cargo fmt --all -- --check

      - name: Check workspace
        working-directory: src-rust
        run: cargo check --workspace --locked

      - name: Run Clippy
        working-directory: src-rust
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        working-directory: src-rust
        run: cargo test --workspace --locked --quiet

      # Contract-freeze fixtures (coven/docs/ENGINE-CONTRACT.md surfaces,
      # slash-command registry, default keybindings, Classic TUI baselines).
      # Already covered by the workspace run above; repeated by name so a
      # contract break is visible as its own failing step.
      - name: Contract fixtures
        working-directory: src-rust
        run: |
          cargo test -p claurst --locked --test engine_contract
          cargo test -p claurst-commands --locked --test slash_command_registry
          cargo test -p claurst-core --locked --test keybindings_golden
          cargo test -p claurst-tui --locked --test classic_baselines

  computer-use-macos:
    name: Check optional computer-use support on macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Check computer-use feature and tests
        working-directory: src-rust
        run: cargo clippy --package claurst-tools --all-targets --features computer-use --locked -- -D warnings

      - name: Test computer-use parsing without hardware access
        working-directory: src-rust
        run: cargo test --package claurst-tools --features computer-use --locked computer_use::tests

  coven-contract:
    name: Coven engine contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (engine + coven)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libopenblas-dev

      - name: Build the engine
        working-directory: src-rust
        run: cargo build -p claurst --locked

      - name: Check out OpenCoven/coven
        uses: actions/checkout@v5
        with:
          repository: OpenCoven/coven
          path: coven-main
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Test reverse-contract guard
        run: python scripts/test-coven-contract-runner.py

      - name: Build consumer contract test executable
        working-directory: coven-main
        run: |
          cargo test -p coven-cli --bin coven --locked --no-run --message-format=json > "$RUNNER_TEMP/coven-test-artifacts.jsonl"

      - name: Run exact consumer engine contract tests
        run: |
          python scripts/run-coven-contract.py \
            --engine "$GITHUB_WORKSPACE/src-rust/target/debug/coven-code" \
            --cargo-artifacts "$RUNNER_TEMP/coven-test-artifacts.jsonl"
