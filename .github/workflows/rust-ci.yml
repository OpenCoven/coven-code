# Throwaway (#568 evidence). Reverted by the next commit on this branch.
name: Rust CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  stress-linux:
    name: Stress 568 (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-rust/target
          key: rust-ci-cargo-${{ runner.os }}-${{ hashFiles('src-rust/Cargo.lock') }}
          restore-keys: rust-ci-cargo-${{ runner.os }}-
      - name: Mutations and stress
        working-directory: src-rust
        run: bash ../.github/stress-568/run.sh linux

  stress-macos:
    name: Stress 568 (macos)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Mutations and stress
        working-directory: src-rust
        run: |
          scratch="$(mktemp -d)"
          export COVEN_HOME="$scratch/coven"
          export COVEN_CAVE_HOME="$scratch/cave"
          export COVEN_CODE_HOME="$scratch/code"
          bash ../.github/stress-568/run.sh macos
