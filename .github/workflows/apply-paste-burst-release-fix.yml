name: Apply paste-burst release-event fix

on:
  push:
    branches:
      - fix/paste-burst-release-events
    paths:
      - .github/workflows/apply-paste-burst-release-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-paste-burst-release-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'OpenCoven/coven-code' && github.ref == 'refs/heads/fix/paste-burst-release-events'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the isolated repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/paste-burst-release-events
          fetch-depth: 0
          persist-credentials: true

      - name: Apply the fail-closed source transformation
        run: python3 scripts/apply-paste-burst-release-fix.py

      - name: Verify the generated patch is narrow and well formed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "src-rust/crates/tui/src/app.rs" ]]; then
            printf 'unexpected generated paths:\n'
            printf '  %s\n' "${changed[@]}"
            exit 1
          fi

      - name: Commit the repair and retire the one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          git config core.hooksPath /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-paste-burst-release-fix.yml
          git rm scripts/apply-paste-burst-release-fix.py
          git add src-rust/crates/tui/src/app.rs
          git commit -m "fix(tui): preserve submit keys across paste releases"
          git push origin HEAD:fix/paste-burst-release-events
