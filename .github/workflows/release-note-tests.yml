name: Release note tests

on:
  pull_request:
    paths:
      - 'scripts/append-patch-note.py'
      - 'scripts/test_append_patch_note.py'
      - 'scripts/regen-release-notes.py'
      - 'scripts/test_release_install_pinning.py'
      - '.github/workflows/patch-release.yml'
      - '.github/workflows/release-note-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Test patch-note insertion without GitHub calls
        run: python3 -B -m unittest discover -s scripts -p test_append_patch_note.py -v
      - name: Require snippet runtimes
        run: |
          command -v bash
          command -v pwsh
      - name: Test release installer version arguments offline
        run: python3 -B scripts/test_release_install_pinning.py -v
